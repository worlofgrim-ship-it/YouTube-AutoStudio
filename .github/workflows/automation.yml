name: YouTube Automation

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:


jobs:

  run:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install
      run:
        pip install -r requirements.txt

    - name: Start Automation
      run:
        python main.py
